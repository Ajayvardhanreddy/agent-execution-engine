services:

  # ─── Layer 3: Agent Execution Engine ──────────────────────────────────────
  agent-engine:
    build: .
    ports:
      - "9000:9000"
    environment:
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
      - MEMORY_SERVICE_URL=${MEMORY_SERVICE_URL:-}
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:9000/health')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  # ─── MCP Server ───────────────────────────────────────────────────────────
  # SSE transport — connects Claude Desktop or any MCP client to the engine.
  # Claude Desktop (local): use stdio transport instead (see docs/mcp-setup.md).
  mcp-server:
    build: .
    ports:
      - "9001:9001"
    environment:
      - ENGINE_URL=http://agent-engine:9000
      - MCP_TRANSPORT=sse
      - MCP_PORT=9001
    command: ["uv", "run", "python", "-m", "engine.mcp.server"]
    depends_on:
      agent-engine:
        condition: service_healthy
